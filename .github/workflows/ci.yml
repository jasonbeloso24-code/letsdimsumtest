name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: CSP, SEO and h1 checks
        run: npm run check:dist
      - name: Link check (internal links)
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: checks every internal link and asset in the built site.
          # External links (Google, Facebook) are skipped so CI doesn't flake on rate limits.
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist/client" "dist/client/**/*.html"
          fail: true
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high
